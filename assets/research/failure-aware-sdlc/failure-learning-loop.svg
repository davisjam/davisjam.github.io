<?xml version="1.0" encoding="UTF-8"?>
<!-- semantic-families: neutral, failure, governance, modeling -->
<!-- Hand-authored SVG (label: failure-learning-loop). Failure-Aware Software Development.
     ONE JOB: an incident is evidence about an engineering ASSUMPTION, and
     learning has occurred only when that evidence changes how the next system
     is engineered.
     Each box states its MECHANISM, not a category word. An earlier version
     labelled them Failure, Evidence, Analysis, Knowledge, Engineering, which
     said only that learning involves learning. The return edge carries the
     strongest sentence in the figure, because it is the claim: without it this
     is failure reporting, not learning.
     RESCALED 260905. Was 117 words on a 1240 canvas at 13px, rendering at
     9.9px in the 940px page column. Now a 1000 canvas with a 15px floor, so the
     smallest substantive text renders at 14.1px.
     Canvas is WHITE: the site component owns the border and padding. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520"
     width="1000" height="520"
     role="img" aria-labelledby="loopTitle loopDesc"
     font-family="Source Sans 3, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="loopTitle">Learning from failure means changing the next system</title>
  <desc id="loopDesc">An assumption fails in a real system. What happened is
    preserved as evidence. Comparing incidents identifies which assumption
    failed and under what conditions. Generalizing beyond the incident yields a
    reusable claim about how systems fail. Institutionalizing that claim changes
    requirements, design, analysis, validation, process and governance, which in
    turn changes the conditions under which the next system is built.</desc>

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <defs>
    <marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57534e"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <text x="36" y="44" font-size="26" font-weight="600" fill="#1c1917"
        font-family="Source Serif 4, Charter, Georgia, serif">Learning from failure means changing the next system</text>
  <text x="36" y="74" font-size="17" fill="#57534e">An incident is evidence about an engineering assumption.</text>

  <rect x="36"  y="112" width="212" height="92" rx="3" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.5"/>
  <rect x="284" y="112" width="212" height="92" rx="3" fill="#f6f4ef" stroke="#57534e" stroke-width="1.5"/>
  <rect x="532" y="112" width="212" height="92" rx="3" fill="#f6f4ef" stroke="#57534e" stroke-width="1.5"/>
  <rect x="780" y="112" width="184" height="92" rx="3" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>

  <line x1="248" y1="158" x2="278" y2="158" stroke="#57534e" stroke-width="1.5" marker-end="url(#aN)"/>
  <line x1="496" y1="158" x2="526" y2="158" stroke="#57534e" stroke-width="1.5" marker-end="url(#aN)"/>
  <line x1="744" y1="158" x2="774" y2="158" stroke="#57534e" stroke-width="1.5" marker-end="url(#aN)"/>

  <path d="M 872 204 L 872 240 L 500 240 L 500 272" fill="none" stroke="#1f7a4d"
        stroke-width="1.5" marker-end="url(#aN)"/>
  <rect x="270" y="272" width="460" height="84" rx="3" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.2"/>
  <path d="M 270 314 L 130 314 L 130 210" fill="none" stroke="#9a3f12" stroke-width="2.2"
        marker-end="url(#aR)"/>

  <text x="56" y="142" font-size="15" font-weight="600" fill="#7f1d1d" letter-spacing="0.05em">FAILURE</text>
  <text x="56" y="172" font-size="18" fill="#1c1917">An assumption fails</text>
  <text x="56" y="192" font-size="18" fill="#1c1917">in a real system</text>

  <text x="304" y="142" font-size="15" font-weight="600" fill="#57534e" letter-spacing="0.05em">EVIDENCE</text>
  <text x="304" y="172" font-size="18" fill="#1c1917">Reports, artifacts,</text>
  <text x="304" y="192" font-size="18" fill="#1c1917">decisions</text>

  <text x="552" y="142" font-size="15" font-weight="600" fill="#57534e" letter-spacing="0.05em">MECHANISM</text>
  <text x="552" y="172" font-size="18" fill="#1c1917">Which assumption</text>
  <text x="552" y="192" font-size="18" fill="#1c1917">failed, and when?</text>

  <text x="800" y="142" font-size="15" font-weight="600" fill="#14532d" letter-spacing="0.05em">KNOWLEDGE</text>
  <text x="800" y="172" font-size="18" fill="#1c1917">A reusable claim</text>
  <text x="800" y="192" font-size="18" fill="#1c1917">about how it fails</text>

  <text x="292" y="302" font-size="15" font-weight="600" fill="#7f2f0c" letter-spacing="0.05em">ENGINEERING CHANGE</text>
  <text x="292" y="334" font-size="18" fill="#1c1917">Requirements · design · analysis · process</text>

  <text x="150" y="386" font-size="17" font-style="italic" fill="#9a3f12">changes the conditions under which the next system is built</text>

  <line x1="36" y1="424" x2="964" y2="424" stroke="#e4e0d8" stroke-width="1"/>
  <text x="36" y="456" font-size="19" fill="#1c1917">The unit of learning is not the incident nor its fix, but the engineering</text>
  <text x="36" y="480" font-size="19" fill="#1c1917">change that survives it.</text>
</svg>
