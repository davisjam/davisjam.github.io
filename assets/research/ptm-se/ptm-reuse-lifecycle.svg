<?xml version="1.0" encoding="UTF-8"?>
<!-- semantic-families: neutral, governance, failure, modeling -->
<!-- Hand-authored SVG (label: ptm-reuse-lifecycle). Software Engineering for Pre-Trained Models.
     ONE JOB: the reuse lifecycle is familiar; the assumptions underneath it are
     not. The top strip is deliberately ordinary, because the point is that
     nothing about the SHAPE of reuse is novel. The claims below are what the
     programme established about the artifact being reused.
     The five row labels are the SAME STRINGS as the page section headings
     (data/program-structure.yaml figure_label), so the figure cannot drift from
     the body.
     RESCALED 260905. Was a 1240 canvas with 13px labels, rendering at 9.9px in
     the 940px page column against 18px body copy. Now a 1000 canvas with a 15px
     floor and 18px claim text, so the smallest substantive text renders at
     14.1px. Each claim line was tightened to fit the narrower canvas at the
     larger size.
     Canvas is WHITE: the site component owns the border and padding. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620"
     width="1000" height="620"
     role="img" aria-labelledby="ptmTitle ptmDesc"
     font-family="Source Sans 3, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="ptmTitle">Reusing a model introduces new engineering obligations</title>
  <desc id="ptmDesc">A familiar reuse lifecycle runs across the top: model
    registry, select, integrate, validate, evolve. Beneath it are five claims the
    programme established. Reuse is familiar but the artifact is not. The
    ecosystem keeps moving. Identity and interoperability are not guaranteed.
    Reuse requires reengineering. Risk travels with the artifact.</desc>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="36" y="44" font-size="26" font-weight="600" fill="#1c1917"
        font-family="Source Serif 4, Charter, Georgia, serif">Reusing a model introduces new engineering obligations</text>
  <text x="36" y="74" font-size="17" fill="#57534e">The lifecycle is familiar. Several assumptions beneath it are not.</text>

  <rect x="36"  y="104" width="166" height="52" rx="2" fill="#f6f4ef" stroke="#57534e" stroke-width="1.3" stroke-dasharray="5 3"/>
  <rect x="226" y="104" width="166" height="52" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <rect x="416" y="104" width="166" height="52" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <rect x="606" y="104" width="166" height="52" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <rect x="796" y="104" width="168" height="52" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <line x1="202" y1="130" x2="222" y2="130" stroke="#57534e" stroke-width="1.2"/>
  <line x1="392" y1="130" x2="412" y2="130" stroke="#57534e" stroke-width="1.2"/>
  <line x1="582" y1="130" x2="602" y2="130" stroke="#57534e" stroke-width="1.2"/>
  <line x1="772" y1="130" x2="792" y2="130" stroke="#57534e" stroke-width="1.2"/>

  <text x="119" y="136" font-size="15" fill="#57534e" text-anchor="middle">MODEL REGISTRY</text>
  <text x="309" y="136" font-size="15" font-weight="600" fill="#1c1917" text-anchor="middle">SELECT</text>
  <text x="499" y="136" font-size="15" font-weight="600" fill="#1c1917" text-anchor="middle">INTEGRATE</text>
  <text x="689" y="136" font-size="15" font-weight="600" fill="#1c1917" text-anchor="middle">VALIDATE</text>
  <text x="880" y="136" font-size="15" font-weight="600" fill="#1c1917" text-anchor="middle">EVOLVE</text>

  <rect x="36" y="192" width="928" height="62" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.2"/>
  <rect x="36" y="264" width="928" height="62" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.2"/>
  <rect x="36" y="336" width="928" height="62" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.2"/>
  <rect x="36" y="408" width="928" height="62" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.2"/>
  <rect x="36" y="480" width="928" height="62" rx="2" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.6"/>

  <text x="58" y="218" font-size="15" font-weight="600" fill="#14532d" letter-spacing="0.05em">REUSE IS FAMILIAR, THE ARTIFACT IS NOT</text>
  <text x="58" y="242" font-size="18" fill="#57534e">Component-reuse knowledge applies until interfaces and provenance stop being explicit.</text>

  <text x="58" y="290" font-size="15" font-weight="600" fill="#14532d" letter-spacing="0.05em">THE ECOSYSTEM KEEPS MOVING</text>
  <text x="58" y="314" font-size="18" fill="#57534e">Practices, formats and failure modes must be re-measured as they change.</text>

  <text x="58" y="362" font-size="15" font-weight="600" fill="#b23b3b" letter-spacing="0.05em">IDENTITY AND INTEROPERABILITY ARE NOT GUARANTEED</text>
  <text x="58" y="386" font-size="18" fill="#57534e">Names do not uniquely identify a model; portability must be tested.</text>

  <text x="58" y="434" font-size="15" font-weight="600" fill="#b23b3b" letter-spacing="0.05em">REUSE REQUIRES REENGINEERING</text>
  <text x="58" y="458" font-size="18" fill="#57534e">Downstream engineers reproduce, adapt and rebuild more than reuse suggests.</text>

  <text x="58" y="506" font-size="15" font-weight="600" fill="#7f2f0c" letter-spacing="0.05em">RISK TRAVELS WITH THE ARTIFACT</text>
  <text x="58" y="530" font-size="18" fill="#57534e">Provenance and serialization become part of the dependency contract.</text>

  <line x1="36" y1="562" x2="964" y2="562" stroke="#e4e0d8" stroke-width="1"/>
  <text x="36" y="594" font-size="19" fill="#1c1917">The reused artifact is not self-describing. Reliable reuse takes engineering work.</text>
</svg>
