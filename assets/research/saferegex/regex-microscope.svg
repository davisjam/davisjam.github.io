<?xml version="1.0" encoding="UTF-8"?>
<!-- semantic-families: neutral, governance -->
<!-- Hand-authored SVG (label: regex-microscope). Regular Expression Engineering.
     ONE JOB: one small artifact is examined from three directions at once, and
     the research lives in the seams between them.
     NO TRIANGLE. Three radial spokes 120 degrees apart, and no outer edges
     whatsoever. Enclosing the hub would assert three bounded categories; the
     spokes instead say three perspectives on one artifact, and the unbounded
     sectors between them are where the seam results sit.
     RESCALED 260905. Was 146 words on a 1240x880 canvas at 13px, rendering at
     9.9px in the 940px page column. Now a 1000x700 canvas with a 15px floor, so
     the smallest substantive text renders at 14.1px. The seam blocks lost their
     third line; the seam NAME and its question were always the content.
     Canvas is WHITE: the site component owns the border and padding. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700"
     width="1000" height="700"
     role="img" aria-labelledby="rxTitle rxDesc"
     font-family="Source Sans 3, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="rxTitle">A software-engineering microscope</title>
  <desc id="rxDesc">A regular expression, described as one line of software,
    sits at the centre of three radial spokes with no enclosing triangle. The
    spokes are three perspectives on the same artifact: regex theory asks what
    it should mean; human factors asks how people reason about it; regex engines
    ask what happens when it runs. The research results sit in the open sectors
    between the spokes. Between theory and human factors, portability and
    composition asks whether meaning survives movement and reuse. Between theory
    and engines, realization asks whether the engine realizes the intended
    semantics safely. Between human factors and engines, security in practice
    asks whether developers can recognize and control pathological
    behavior.</desc>

  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="36" y="44" font-size="26" font-weight="600" fill="#1c1917"
        font-family="Source Serif 4, Charter, Georgia, serif">A software-engineering microscope</text>
  <text x="36" y="74" font-size="17" fill="#57534e">One small artifact exposes the seams between theory, reasoning, and implementation.</text>

  <!-- Three spokes at 120 degrees. They stop short of the hub and end at a node;
       there is deliberately no edge between any two nodes. -->
  <line x1="500" y1="316" x2="500" y2="204" stroke="#57534e" stroke-width="1.4"/>
  <line x1="447" y1="407" x2="349" y2="463" stroke="#57534e" stroke-width="1.4"/>
  <line x1="553" y1="407" x2="651" y2="463" stroke="#57534e" stroke-width="1.4"/>

  <circle cx="500" cy="196" r="6" fill="#57534e"/>
  <circle cx="341" cy="468" r="6" fill="#57534e"/>
  <circle cx="659" cy="468" r="6" fill="#57534e"/>

  <!-- the object under the microscope -->
  <circle cx="500" cy="376" r="62" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.2"/>
  <text x="500" y="371" font-size="19" font-weight="600" fill="#7f2f0c" text-anchor="middle">REGEX</text>
  <text x="500" y="393" font-size="15" fill="#7f2f0c" text-anchor="middle">one line of software</text>

  <text x="500" y="122" font-size="15" font-weight="600" fill="#57534e" letter-spacing="0.06em" text-anchor="middle">REGEX THEORY</text>
  <text x="500" y="152" font-size="19" fill="#1c1917" text-anchor="middle">What should it mean?</text>
  <text x="500" y="176" font-size="15" font-style="italic" fill="#78716c" text-anchor="middle">Semantics · features · expressiveness</text>

  <text x="333" y="506" font-size="15" font-weight="600" fill="#57534e" letter-spacing="0.06em" text-anchor="end">HUMAN FACTORS</text>
  <text x="333" y="536" font-size="19" fill="#1c1917" text-anchor="end">How do people reason about it?</text>
  <text x="333" y="560" font-size="15" font-style="italic" fill="#78716c" text-anchor="end">Comprehension · reuse · repair</text>

  <text x="667" y="506" font-size="15" font-weight="600" fill="#57534e" letter-spacing="0.06em">REGEX ENGINES</text>
  <text x="667" y="536" font-size="19" fill="#1c1917">What happens when it runs?</text>
  <text x="667" y="560" font-size="15" font-style="italic" fill="#78716c">Matching · performance · ReDoS</text>

  <!-- The seams sit in the open sectors, which is the point: the results are
       not inside any one discipline. -->
  <text x="396" y="272" font-size="15" font-weight="600" fill="#9a3f12" letter-spacing="0.05em" text-anchor="end">PORTABILITY</text>
  <text x="396" y="296" font-size="16" fill="#44403c" text-anchor="end">Does meaning survive reuse?</text>

  <text x="604" y="272" font-size="15" font-weight="600" fill="#9a3f12" letter-spacing="0.05em">REALIZATION</text>
  <text x="604" y="296" font-size="16" fill="#44403c">Does the engine realize it safely?</text>

  <text x="500" y="606" font-size="15" font-weight="600" fill="#9a3f12" letter-spacing="0.05em" text-anchor="middle">SECURITY IN PRACTICE</text>
  <text x="500" y="630" font-size="16" fill="#44403c" text-anchor="middle">Can developers recognize pathological behavior?</text>

  <line x1="36" y1="656" x2="964" y2="656" stroke="#e4e0d8" stroke-width="1"/>
  <text x="36" y="686" font-size="19" fill="#1c1917">The seams are the subject: a regex is small enough to inspect, and still crosses every layer.</text>
</svg>
