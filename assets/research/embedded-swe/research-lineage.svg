<?xml version="1.0" encoding="UTF-8"?>
<!-- semantic-families: neutral, governance -->
<!-- Hand-authored SVG (label: research-lineage). Embedded Software Engineering.
     ONE JOB: embedded systems defeat analysis in several distinct ways, and the
     programme attacks each with complementary methods.
     NOT A PIPELINE. An earlier version drew the publication chronology as
     validation to rehosting to analysis to proof, asserting a causality that is
     not the shape of the work: rehosting did not have to establish static
     analysis, and CodeQL did not have to precede unit proofing. Four parallel
     lines arranged around a shared goal is faithful; left to right is a history
     of papers.
     No spokes to the centre and no heavier outline on any one quadrant: both
     read as sequence or as "three precursors plus the real research".
     RESCALED 260905. Was 202 words on a 1240 canvas at 13px, which renders at
     9.9px in the 940px page column. Now ~105 words on a 1000 canvas with a 15px
     floor, so the smallest substantive text renders at 14.1px. What went was
     the three line paragraph inside each quadrant; the question and the named
     artifacts were always the content.
     Canvas is WHITE: the site component owns the border and padding. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640"
     width="1000" height="640"
     role="img" aria-labelledby="emTitle emDesc"
     font-family="Source Sans 3, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="emTitle">Four lines of attack on reliable embedded software</title>
  <desc id="emDesc">Four complementary lines of work meet at practical
    assurance. Understanding failure asks what goes wrong in real embedded
    software, through packet validation and layering violations. Making code
    reachable asks how firmware can be analyzed away from its hardware, through
    rehosting, LEMIX and bottom-up testing. Analyzing at scale asks whether
    useful analyses can become cheap enough to apply broadly, using CodeQL and
    OSS-Fuzz-Gen. Establishing guarantees asks whether verification can become
    an ordinary engineering step, through Unit Proofing, compositional bounded
    model checking and AutoSOUP.</desc>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="36" y="44" font-size="26" font-weight="600" fill="#1c1917"
        font-family="Source Serif 4, Charter, Georgia, serif">Four lines of attack on reliable embedded software</text>
  <text x="36" y="74" font-size="17" fill="#57534e">Embedded systems defeat analysis in different ways.</text>

  <rect x="36"  y="104" width="430" height="152" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <rect x="534" y="104" width="430" height="152" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <rect x="36"  y="384" width="430" height="152" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <rect x="534" y="384" width="430" height="152" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>

  <circle cx="500" cy="320" r="60" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.8"/>
  <text x="500" y="314" font-size="15" font-weight="600" fill="#7f2f0c" text-anchor="middle">PRACTICAL</text>
  <text x="500" y="334" font-size="15" font-weight="600" fill="#7f2f0c" text-anchor="middle">ASSURANCE</text>

  <text x="60" y="138" font-size="15" font-weight="600" fill="#9a3f12" letter-spacing="0.06em">1 — UNDERSTAND FAILURE</text>
  <text x="60" y="178" font-size="19" fill="#1c1917">What goes wrong in real</text>
  <text x="60" y="202" font-size="19" fill="#1c1917">embedded software?</text>
  <text x="60" y="236" font-size="15" font-style="italic" fill="#57534e">Packet validation · layering violations</text>

  <text x="558" y="138" font-size="15" font-weight="600" fill="#9a3f12" letter-spacing="0.06em">2 — MAKE CODE REACHABLE</text>
  <text x="558" y="178" font-size="19" fill="#1c1917">How can firmware be analyzed</text>
  <text x="558" y="202" font-size="19" fill="#1c1917">away from its hardware?</text>
  <text x="558" y="236" font-size="15" font-style="italic" fill="#57534e">Rehosting · LEMIX · bottom-up testing</text>

  <text x="60" y="418" font-size="15" font-weight="600" fill="#9a3f12" letter-spacing="0.06em">3 — ANALYZE AT SCALE</text>
  <text x="60" y="458" font-size="19" fill="#1c1917">Can useful analyses become</text>
  <text x="60" y="482" font-size="19" fill="#1c1917">cheap enough to apply broadly?</text>
  <text x="60" y="516" font-size="15" font-style="italic" fill="#57534e">CodeQL · OSS-Fuzz-Gen</text>

  <text x="558" y="418" font-size="15" font-weight="600" fill="#9a3f12" letter-spacing="0.06em">4 — ESTABLISH GUARANTEES</text>
  <text x="558" y="458" font-size="19" fill="#1c1917">Can verification become an</text>
  <text x="558" y="482" font-size="19" fill="#1c1917">ordinary engineering step?</text>
  <text x="558" y="516" font-size="15" font-style="italic" fill="#57534e">Unit Proofing · compositional BMC · AutoSOUP</text>

  <line x1="36" y1="566" x2="964" y2="566" stroke="#e4e0d8" stroke-width="1"/>
  <text x="36" y="598" font-size="19" fill="#1c1917">No single technique solves embedded assurance: knowing what to look for,</text>
  <text x="36" y="622" font-size="19" fill="#1c1917">reaching the code, making analysis affordable, and proving absence.</text>
</svg>
