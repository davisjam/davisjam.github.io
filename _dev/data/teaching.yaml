# data/teaching.yaml — the Teaching page's narrative and enumerative records.
#
# The argument the page makes, in order:
#   teaching philosophy -> curricular leadership -> courses -> undergraduate
#   research -> student outcomes -> recognition -> SoTL that feeds back in.
#
# MAGE appears as teaching INFRASTRUCTURE supporting ECE 30861, not as a peer of
# the courses. It is rendered as an inset inside the 30861 section: making it an
# h3 sibling of the course headings would state, typographically, that it is a
# third course. It is not.
#
# Recognition is NOT authored here. It is generated from data/awards.yaml groups
# `teaching` and `mentoring`, so the page cannot drift from the award record.
# Student outcomes ARE here because they are awards to STUDENTS, which
# awards.yaml does not model.

schema_version: 1
opener:
- I teach software engineering as an engineering discipline. My students learn not only what to do and
  how to do it, but why, when, and how else. The goal is not beautiful code for its own sake, but the
  disciplined construction and modification of software under real technical, organizational, and professional
  constraints.
- My courses therefore center on substantial engineering problems rather than isolated exercises. Students
  make decisions under incomplete information, work individually and in teams, build and evaluate real
  systems, and learn to justify their choices. I extend the same philosophy beyond individual courses
  through curriculum development and sustained undergraduate research mentoring.
curricular_leadership:
  heading: Curricular leadership
  paragraphs:
  - I have helped build Purdue ECE's software-engineering curriculum across undergraduate and graduate
    education.
  - When I joined Purdue in 2020 as ECE's first faculty member specializing in software engineering, the
    Computer Engineering curriculum did not have a dedicated software-engineering course. Since then,
    I have designed and piloted new undergraduate and graduate software-engineering courses, substantially
    redesigned the accompanying software-engineering tools course, and helped integrate these offerings
    into a new undergraduate Software Engineering concentration. I also helped design and launch Purdue's
    M.S. in Software Engineering jointly with Computer Science.
  - These courses now serve more than 250 students each year. Demand for the undergraduate course led
    ECE to add a second section in Indianapolis, and four other ECE faculty have taught courses using
    the resulting curriculum and materials.
  - My curricular work also extends to program-level assessment and improvement. I served on ECE's Undergraduate
    Curriculum Committee and subsequently helped lead the successful 2025 ABET review for Computer Engineering,
    with responsibility for documenting and evaluating the program's continuous-improvement process.
courses:
  heading: Courses
  entries:
  - id: ece-30861
    catalog_url: https://engineering.purdue.edu/ECE/Academics/Undergraduates/UGO/CourseInfo/courseInfo?courseid=814&show=true&type=undergrad
    paragraphs:
    - My undergraduate software-engineering course teaches students how to exercise informed control over
      consequential software systems. Students study software process, teamwork, requirements, specification,
      architecture, design, validation, deployment, security, maintenance, and engineering decision-making
      while building and evaluating a substantial system in teams.
    - 'The course addresses a central problem for contemporary software engineering: implementation can
      be delegated to capable agents, but responsibility for the resulting system cannot. Students therefore
      learn not only how software is realized, but how engineers specify what should be built, preserve
      important knowledge outside the implementation, establish evidence about consequential properties,
      supervise delegated work, and decide when a system is ready to be admitted into use.'
    - The course materials are openly available through [Teach with MAGE](https://davisjam.github.io/model-based-agentic-software-engineering/teach/).
  - id: ece-50874
    catalog_url: https://engineering.purdue.edu/ECE/Academics/Undergraduates/UGO/CourseInfo/courseInfo?courseid=777&show=true&type=grad
    paragraphs:
    - ECE 50874 is the graduate sequel to ECE 30861. Where the undergraduate course develops the core
      activities of software engineering, the graduate course uses engineering standards, notably IEC
      61508, to structure the problem of software assurance. Students examine more advanced techniques
      and research for establishing evidence about software systems, reasoning about risk, and determining
      what confidence different forms of evidence actually justify.
undergraduate_research:
  heading: Undergraduate research as teaching
  paragraphs:
  - Research is one of my primary teaching environments.
  - Since joining Purdue, I have mentored more than 175 undergraduate researchers through Vertically Integrated
    Projects (VIP), SURF, NSF REU, OUR Scholars, the Colombia–Purdue Partnership, independent study, and
    related programs. I have also supervised 12 senior-design projects through these research activities.
  - I treat undergraduate research as a progression toward independence. Students can enter a continuing
    project with limited research experience and a well-scaffolded technical role, then take on increasingly
    substantial responsibilities as they develop. I pair undergraduate researchers with graduate students
    for near-peer mentoring, while experienced undergraduates themselves become technical leaders and
    mentors for newer students.
  - The goal is to train both researchers and engineers. Students learn to formulate questions, design
    experiments, analyze evidence, build production-quality software, communicate results, and decide
    what to do when the answer is not already known.
  stats:
  - value: 175+
    label: undergraduate researchers mentored
  - value: '27'
    label: undergraduate research authors
  - value: '12'
    label: senior-design projects
  closing:
  - Twenty-seven undergraduate mentees have become authors — including several lead authors — on peer-reviewed
    papers, posters, and a U.S. patent application. Engineering-focused students have also contributed
    artifacts used outside the university, including seven models accepted to Google's TensorFlow Model
    Garden.
  - '[Meet the lab →](/people/)'
vip:
  heading: Vertically Integrated Projects
  paragraphs:
  - I have run undergraduate VIP research teams continuously since Fall 2020. These teams provide a persistent
    environment in which students at different stages can work together on research and engineering problems
    over multiple semesters.
  - 'Recent and past teams include:'
  teams:
  - title: Software Engineering with Pre-Trained Models
    blurb: Research and engineering around the reuse, integration, reliability, and security of pre-trained
      models.
  - title: Open-Source TensorFlow Software
    blurb: Students contributed models and engineering work to the TensorFlow ecosystem, including artifacts
      accepted into Google's TensorFlow Model Garden.
  - title: SafeRegex
    blurb: Research and engineering on the reliability and security of regular expressions.
