sotl:
  heading: Scholarship of teaching and learning
  paragraphs:
    - >-
      My scholarship of teaching and learning includes six peer-reviewed papers.
      I study the teaching of software engineering itself. My education
      research examines how students develop software-engineering competencies
      through experiential and problem-based learning, how systems thinking can
      improve cybersecurity education, and how generative AI changes
      software-engineering education.
    - >-
      This work feeds back into my courses. Studies of experiential learning
      informed the problem-based structure of ECE 30861; subsequent work examined
      global software-engineering education and cybersecurity competency within
      the course. More recently, my collaborators and I have studied how students
      use large language models in semester-long software-engineering projects
      and how curricula should prepare students for GenAI-assisted engineering.
  # No stat band here: the sentence below carries the same three facts and
  # says what the funding is intellectually FOR, which "two NSF awards" did not.
  #
  # ONLY 2452533 IS NAMED. The award packet describes a second education award,
  # NSF #2343596, as "creating software-engineering learning modules that
  # leverage generative AI" -- but the NSF Award Search record and this repo's
  # own funding.yaml both title it "Collaborative Research: EAGER: CET:
  # Exploring The Risks and Rewards of Large Language Models in Enabling
  # Energy-Efficient Data Center Software Infrastructure", which is a research
  # award about data-centre energy, not an education award. The amount matches
  # ($149,976); the subject does not. Flagged for James rather than published.
  closing:
    - >-
      Our 2024 ASEE work on integrating systems thinking into cybersecurity
      education received a Best Paper Award. This work has been supported by
      approximately $730,000 in education-focused projects, including [NSF
      #2452533](https://www.nsf.gov/awardsearch/showAward?AWD_ID=2452533), on
      defining competencies for GenAI-assisted software engineering.
