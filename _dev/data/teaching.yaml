sotl:
  heading: Scholarship of teaching and learning
  paragraphs:
  - My scholarship of teaching and learning includes six peer-reviewed papers. I study the teaching of
    software engineering itself. My education research examines how students develop software-engineering
    competencies through experiential and problem-based learning, how systems thinking can improve cybersecurity
    education, and how generative AI changes software-engineering education.
  - This work feeds back into my courses. Studies of experiential learning informed the problem-based
    structure of ECE 30861; subsequent work examined global software-engineering education and cybersecurity
    competency within the course. More recently, my collaborators and I have studied how students use
    large language models in semester-long software-engineering projects and how curricula should prepare
    students for GenAI-assisted engineering.
  closing:
  - 'Our 2024 ASEE work on integrating systems thinking into cybersecurity education received a Best Paper
    Award. This work has been supported by approximately $730,000 in education-focused projects, including
    [NSF #2452533](https://www.nsf.gov/awardsearch/showAward?AWD_ID=2452533), on defining competencies
    for GenAI-assisted software engineering.'
textbooks:
  heading: Textbooks
  paragraphs:
  - 'In early 2026, coding agents became sufficiently capable as to substantially change software engineering
    work. To learn the new nature of the discipline, I spent six months saturating four Claude Max 20×
    accounts while building a large production software system. Implementation had become dramatically
    cheaper, but the engineer''s responsibility for the resulting system had not. The central problem
    was increasingly one of control and supervision: how can engineers understand and direct work produced
    at machine speed, establish that consequential properties hold, recognize when assumptions fail, and
    intervene when necessary?'
  - I responded by writing and openly publishing two complementary textbooks.
  books:
  - title: Software Engineering Handbook
    url: https://davisjam.github.io/model-based-agentic-software-engineering/book/se-handbook/index.html
    paragraphs:
    - 'The Software Engineering Handbook develops the foundations needed to exercise informed control
      over software systems: engineering process, teamwork, requirements, specification, architecture,
      design, validation, and engineering decision-making. It asks what engineers need to know and do
      when producing the implementation is no longer necessarily the difficult part.'
  - title: Model-Based Agentic Software Engineering (MAGE)
    url: https://davisjam.github.io/model-based-agentic-software-engineering/book/mage-book/index.html
    paragraphs:
    - Model-Based Agentic Software Engineering (MAGE) begins where the Handbook leaves off. The Handbook
      develops the enduring activities through which engineers understand and control software systems;
      MAGE asks how those activities must be organized when capable agents can perform much of the realization.
      It develops Modeling, Alignment, and related structures for supervising delegated work while engineers
      retain informed control and responsibility.
  closing:
  - Both books are instantiated in the openly published [Teach with MAGE](https://davisjam.github.io/model-based-agentic-software-engineering/teach/)
    course materials.
