undergraduate:
  heading: Undergraduate research
  paragraphs:
    - >-
      Undergraduates are a substantial part of Duality Lab. Students participate
      through Vertically Integrated Projects, senior design, independent
      research, SURF, NSF REU, and related programs.
    # The three counts are NOT written here. They are the same facts the
    # Teaching page states, and a second copy would drift the first time one
    # changed. `{mentored}` / `{authors}` / `{senior_design}` are filled from
    # teaching.yaml's undergraduate_research.stats, so the two pages cannot
    # disagree by construction.
    - >-
      Since 2020, {mentored} undergraduate researchers have worked with the
      group. At least {authors} have become authors on peer-reviewed papers,
      posters, and other scholarly outputs, alongside {senior_design}
      senior-design projects supervised through these research activities.
  link: {label: Learn more about undergraduate research and mentoring, url: /teaching/}
  # CURRENT teams only. The TensorFlow (F20-F23) and SafeRegex (F20-S21) VIP
  # teams are historical and must not be presented as current -- their terms are
  # in data/courses.yaml.
  current_teams:
    - title: Software Engineering with Pre-Trained Models
      url: /research/ptm-se/
      blurb: >-
        Students study the reuse, integration, reliability, and security of
        pre-trained models.

