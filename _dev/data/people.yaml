# data/people.yaml — Duality Lab people.
#
# THE RULE (James, 260905): current people are individuals; past undergraduate
# mentorship is a record of OUTCOMES, not an attendance ledger.
#
# There is deliberately NO selected-undergraduate-alumni list. With 27+
# undergraduate co-authors, any selection is arbitrary and implicitly declares
# which of them mattered. Undergraduate mentorship is shown at scale here and in
# depth on the Teaching page, which owns the quantitative and pedagogical story.
# Do not add such a list later.
#
# PROVENANCE. Every person below is derived from in-repo authoritative records,
# not from memory or the open web:
#   - status + degree + year   -> data/news.yaml (defenses, prelims, placements)
#   - research area            -> data/publications.yaml (their co-authored
#                                 papers' `projects`, dominant project wins)
# Anyone the record mentions but does not let me classify is in
# `needs_confirmation` rather than guessed into a roster.
#
# TWO FIELDS ARE DELIBERATELY EMPTY EVERYWHERE, awaiting supplied data:
#   photo     -- current graduate researchers should carry headshots. None
#                exist in the repo. A person without one renders text-only; do
#                NOT substitute a silhouette placeholder.
#   linkedin  -- a person's NAME is the link, and there is no other LinkedIn
#                affordance on the page. A LinkedIn URL must never be
#                constructed or guessed from a name, so names stay unlinked
#                until a verified profile is supplied.

schema_version: 1

# Every graduate researcher is in ECE; stated once rather than nine times.
department: Electrical and Computer Engineering

# One line per research programme, so a person's area is never hand-written.
area_phrases:
  ptm-se: Reuse, reliability, and security of pre-trained models
  software-supply-chain: Software supply chains, signing, and trustworthy reuse
  failure-aware-sdlc: Learning engineering knowledge from software failures
  embedded-swe: Reliability and security of embedded software
  saferegex: Reliability and security of regular expressions
  mage: Model-based agentic software engineering

faculty:
