# data/funding.yaml — canonical funding records.
#
# Keyed on the CV's own G- identifiers so the two stay mutually checkable.
# Source: JamesDavis-CV.pdf, EXTERNAL GRANTS.
#
# `projects:` is MANY-TO-MANY and EXPLICIT ONLY. Per model/content-model.md §1 P2,
# a grant supported a program only where that edge is asserted here. An absent
# edge is not a gap to fill by inference -- it means either the relationship does
# not exist, or a human has not yet asserted it. Both resolve by leaving it out.
#
# Grants with `projects: []` are real grants with no asserted program
# attribution. They belong on the CV and may appear on the umbrella site. They
# do not appear on a project site.

