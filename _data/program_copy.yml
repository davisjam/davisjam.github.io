# data/program-copy.yaml — authored hero prose for each research programme.
#
# Moved out of generators/generate_sites.py, which builds the retired
# standalone sites and is slated for deletion. This is the one load-bearing
# thing in that file: prose written and revised with James, not derivable
# from any record. Deleting the generator must not take it along.
#
# Section headings and their prose live in data/program-structure.yaml;
# this file holds only the question and the hero paragraphs.

schema_version: 1
programs:
  mage:
    question: "How should we engineer software when implementation becomes abundant but engineering judgment remains scarce?"
    intro:
      - "Capable agents have made it much cheaper to produce working code. They have not made it cheaper to decide what should be built, which obligations govern it, how to read the resulting evidence, or whether the system is acceptable to ship."
      - "MAGE studies the engineering structures that make delegated implementation governable: making consequential knowledge explicit as models, giving selected obligations authority over what agents produce, validating realizations against those models, and turning recurring human judgment into structures that later work can reuse."
  embedded-swe:
    question: "How can analysis and assurance become practical for embedded software?"
    intro:
      - "Embedded software runs where failures are expensive, and in conditions that defeat the assumptions most analysis tools are built on: no operating system to speak of, hardware that the analysis cannot reach, and code that cannot simply be run in a test harness."
      - "Our work has attacked that gap in stages. We studied defects in real embedded network stacks, built rehosting infrastructure so firmware can execute away from its target hardware, and applied static analysis at a scale where it finds hundreds of defects across many projects. A current thrust, Unit Proofing, asks whether component-level formal verification can be made cheap enough to use as an ordinary engineering step rather than a special occasion."
  failure-aware-sdlc:
    question: "What can engineering organizations learn from the ways software fails?"
    intro:
      - "Software failures are investigated, patched, and filed away. The engineering knowledge they contain rarely survives the incident that produced it, so organizations meet the same class of failure again in the next system."
      - "We study failures empirically and ask what would have to change for that knowledge to persist. Some of our work characterizes how failures recur across systems and domains; other work examines whether evidence from past failures actually changes engineering decisions, and how organizations might structure requirements, design, and validation so that it does."
  ptm-se:
    question: "What changes about software engineering when the reused component is a learned model?"
    intro:
      - "Developers have been reusing software components for decades; pre-trained models inherit many of the same engineering problems, but also introduce new ones, because their identity, behavior, provenance, and interfaces are less explicit than those of conventional software packages."
      - "We study pre-trained model reuse as a software-engineering practice. Our work asks which lessons from conventional component reuse still apply, where learned artifacts break those assumptions, and what new engineering methods are needed for selecting, integrating, validating, securing, and evolving models obtained from public registries."
  software-supply-chain:
    question: "How can software reuse remain trustworthy at ecosystem scale?"
    intro:
      - "Modern software systems depend on artifacts produced by people and organizations their developers may never meet. Package registries and build systems make reuse inexpensive, but they separate the act of using software from direct knowledge of who produced it, how it reached the consumer, and what authority it should receive once incorporated into a system."
      - "We study the evidence and engineering mechanisms that make trust possible across those boundaries: establishing identity and provenance, protecting the distribution process, and making trust decisions sensitive to the context in which a dependency is actually used. Across these problems, the recurring question is not simply whether software is trusted, but what evidence justifies what trust, for what use."
  saferegex:
    question: "What do small, heavily reused program fragments reveal about software engineering?"
    intro:
      - "A regular expression is a few characters long and is copied between languages, libraries, and projects with little thought. That makes it a useful subject: the same artifact is reused across many contexts, so its behaviour exposes assumptions that larger components hide."
      - "We have examined regexes along three lines that ran concurrently for most of a decade. One asks whether a regex means the same thing when it moves between languages. One asks what developers actually understand about the expressions they write. The third asks what a matching engine does with them, including the conditions under which matching becomes a denial-of-service vector, and what can be done about it."
