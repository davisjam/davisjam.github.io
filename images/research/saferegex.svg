  <title id="arcTitle">The regular-expression research arc, 2017 to 2026</title>
  <desc id="arcDesc">Three concurrent lines of inquiry into regular expressions:
    reuse and portability, human understanding, and execution and security. Each
    ran across most of the period rather than succeeding the others. Together
    they established that small reused artifacts carry hidden assumptions across
    languages, developers, and runtimes, which motivated the later work on
    dependencies, reuse, and assurance.</desc>

