<?xml version="1.0" encoding="UTF-8"?>
<!-- semantic-families: neutral, modeling, governance, failure -->
<!-- Hand-authored SVG (label: ptm-reuse-lifecycle). SE for Pre-Trained Models.
     ONE JOB: a reused model breaks several assumptions that make ordinary
     software reuse cheap, and each has to be re-established downstream.
     REPLACED 260905. The previous figure ran two bars — Compatibility, Trust —
     across the lifecycle. Those are TOPICS the portfolio touches, and drawing
     them as bands implied they were the two dominant through-lines and that
     both had been characterized end to end. The bands below now state what the
     work ESTABLISHED, and their labels are the same strings as the page section
     headings (program-structure.yaml figure_label).
     Deliberately no neural-network imagery. White canvas; the site component
     owns the border. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640"
     role="img" aria-labelledby="ptmTitle ptmDesc"
     font-family="Source Sans 3, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="ptmTitle">Reusing a model introduces new engineering obligations</title>
  <desc id="ptmDesc">A model moves through a familiar reuse lifecycle — registry,
    select, integrate, validate, evolve — but several assumptions of conventional
    dependency management stop holding. Reuse is familiar while the artifact is
    not; the ecosystem keeps moving and must be re-measured; identity and
    interoperability are not guaranteed; reuse requires reengineering downstream;
    and risk travels with the artifact.</desc>

  <rect x="0" y="0" width="1240" height="640" fill="#ffffff"/>

  <text x="40" y="46" font-size="25" font-weight="600" fill="#1c1917"
        font-family="Source Serif 4, Charter, Georgia, serif">Reusing a model introduces new engineering obligations</text>
  <text x="40" y="76" font-size="16" fill="#57534e">The lifecycle is familiar. Several assumptions of conventional dependency management are not.</text>

  <!-- the familiar lifecycle -->
  <rect x="40"  y="108" width="196" height="58" rx="2" fill="#f6f4ef" stroke="#57534e" stroke-width="1.3" stroke-dasharray="5 3"/>
  <rect x="276" y="108" width="196" height="58" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <rect x="512" y="108" width="196" height="58" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <rect x="748" y="108" width="196" height="58" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <rect x="984" y="108" width="216" height="58" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.3"/>
  <line x1="236" y1="137" x2="268" y2="137" stroke="#57534e" stroke-width="1.2"/>
  <line x1="472" y1="137" x2="504" y2="137" stroke="#57534e" stroke-width="1.2"/>
  <line x1="708" y1="137" x2="740" y2="137" stroke="#57534e" stroke-width="1.2"/>
  <line x1="944" y1="137" x2="976" y2="137" stroke="#57534e" stroke-width="1.2"/>

  <text x="138" y="143" font-size="15" fill="#57534e" text-anchor="middle">MODEL REGISTRY</text>
  <text x="374" y="143" font-size="15" font-weight="600" fill="#1c1917" text-anchor="middle">SELECT</text>
  <text x="610" y="143" font-size="15" font-weight="600" fill="#1c1917" text-anchor="middle">INTEGRATE</text>
  <text x="846" y="143" font-size="15" font-weight="600" fill="#1c1917" text-anchor="middle">VALIDATE</text>
  <text x="1092" y="143" font-size="15" font-weight="600" fill="#1c1917" text-anchor="middle">EVOLVE</text>

  <!-- what the work established -->
  <rect x="40" y="204" width="1160" height="62" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.2"/>
  <rect x="40" y="282" width="1160" height="62" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.2"/>
  <rect x="40" y="360" width="1160" height="62" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.2"/>
  <rect x="40" y="438" width="1160" height="62" rx="2" fill="#ffffff" stroke="#57534e" stroke-width="1.2"/>
  <rect x="40" y="516" width="1160" height="62" rx="2" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.6"/>

  <text x="62" y="230" font-size="13" font-weight="600" fill="#14532d" letter-spacing="0.06em">REUSE IS FAMILIAR, THE ARTIFACT IS NOT</text>
  <text x="62" y="253" font-size="15" fill="#57534e">Decades of component-reuse knowledge apply — until the interfaces and provenance stop being explicit.</text>

  <text x="62" y="308" font-size="13" font-weight="600" fill="#14532d" letter-spacing="0.06em">THE ECOSYSTEM KEEPS MOVING</text>
  <text x="62" y="331" font-size="15" fill="#57534e">Reuse practices, formats, conventions and failure modes must be re-measured as they change.</text>

  <text x="62" y="386" font-size="13" font-weight="600" fill="#b23b3b" letter-spacing="0.06em">IDENTITY AND INTEROPERABILITY ARE NOT GUARANTEED</text>
  <text x="62" y="409" font-size="15" fill="#57534e">Names do not uniquely identify a model, and portability across formats must be tested, not assumed.</text>

  <text x="62" y="464" font-size="13" font-weight="600" fill="#b23b3b" letter-spacing="0.06em">REUSE REQUIRES REENGINEERING</text>
  <text x="62" y="487" font-size="15" fill="#57534e">Downstream engineers reproduce, adapt and rebuild more than package reuse would suggest.</text>

  <text x="62" y="542" font-size="13" font-weight="600" fill="#7f2f0c" letter-spacing="0.06em">RISK TRAVELS WITH THE ARTIFACT</text>
  <text x="62" y="565" font-size="15" fill="#57534e">Provenance, serialization and upstream change become part of the dependency contract.</text>

  <line x1="40" y1="600" x2="1200" y2="600" stroke="#e4e0d8" stroke-width="1"/>
  <text x="40" y="624" font-size="15" fill="#1c1917">The reused artifact is not self-describing. Reliable reuse requires engineering work to establish identity, compatibility, reproducibility and safety.</text>
</svg>
